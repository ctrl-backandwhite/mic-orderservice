spring:
    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5405/db05}
        username: ${SPRING_DATASOURCE_USERNAME:user05}
        password: ${SPRING_DATASOURCE_PASSWORD:pass05}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: true
    liquibase:
        enabled: true
        change-log: classpath:db/changelog/db.changelog-master.yaml
        contexts: local
    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        enabled: true
        consumer:
            auto-offset-reset: earliest
    data:
        redis:
            host: ${SPRING_DATA_REDIS_HOST:localhost}
            port: ${SPRING_DATA_REDIS_PORT:6379}
            database: ${SPRING_DATA_REDIS_DATABASE:5}
            timeout: 60000

logging:
    level:
        root: INFO

# ── Local testing flags ─────────────────────────────────────────────────────
# app.cj.mock-mode=true → MockCjShoppingAdapter reemplaza el cliente HTTP real.
#   Nada se envía a CJ Dropshipping: createOrder, addCart, payBalanceV2, etc.
#   devuelven respuestas sintéticas con IDs "MOCK_*". Todo lo demás (ledger,
#   snapshot, historial, tracking UI, webhooks entrantes) funciona normal.
# Override desde env: CJ_MOCK_MODE=false para hablar con CJ real.
#
# CJ_ENABLED controla el scheduler + el registro de webhooks al arranque;
# déjalo en false si tampoco quieres que el scheduler corra en local.
app:
    cj:
        mock-mode: ${CJ_MOCK_MODE:true}
        enabled: ${CJ_ENABLED:false}
