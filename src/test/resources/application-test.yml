spring:
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:9000

    kafka:
        enabled: false
        bootstrap-servers: ${spring.kafka.bootstrap-servers:localhost:9092}

nx:
    security:
        gateway-filter:
            skip-prefixes: /api/v1/cj/webhook

app:
    cj:
        webhook:
            secret: test-webhook-secret-abc123

test:
    postgres:
        username: testuser
        password: testpass
        database: order_test_db
